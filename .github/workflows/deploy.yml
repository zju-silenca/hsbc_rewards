# 发布 Release 后自动部署看板到 Cloudflare（也可以在 Actions 页面手动运行）
name: Deploy to Cloudflare

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # 油猴只在 @version 变大时才提示更新：Release 标签必须和脚本版本一致（v4.2.1 ↔ @version 4.2.1）
      - name: Check tag matches @version
        if: github.event_name == 'release'
        working-directory: .
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ver=$(sed -n 's|^// @version *||p' hsbc_bill_export.user.js | tr -d '[:space:]')
          echo "tag=$TAG  @version=$ver"
          if [ "${TAG#v}" != "$ver" ]; then
            echo "::error::Release 标签 $TAG 与脚本 @version $ver 不一致，请先改脚本版本号再发布"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify
        working-directory: .
        run: |
          ver=$(sed -n 's|^// @version *||p' hsbc_bill_export.user.js | tr -d '[:space:]')
          live=""
          for i in 1 2 3 4 5 6; do
            live=$(curl -fsS "https://bill.pi-app.kdns.fr/hsbc_bill_export.user.js?t=$(date +%s)" | sed -n 's|^// @version *||p' | tr -d '[:space:]') || true
            echo "线上 @version=$live"
            [ "$live" = "$ver" ] && exit 0
            sleep 10
          done
          echo "::error::线上脚本版本 $live 与仓库 $ver 不一致"
          exit 1
