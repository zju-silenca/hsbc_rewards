# 网站与油猴脚本分开发版，任何一边发布 Release 都会重新部署 Cloudflare：
#   web-v1.2.0     → 网站（web/ 目录 + 看板用的计算核心）取这个标签；版本号 = web/package.json 的 version
#   script-v4.2.1  → 供安装/更新的油猴脚本取这个标签；版本号 = 脚本里的 @version
# 另一边沿用它最新的标签（还没有标签时用当前分支）。也可以在 Actions 页面手动运行（两边都取最新标签）。
# push 到 dev 分支 → 开发测试站 hsbc-rewards-dev（网站和脚本都取这次提交，脚本是独立的 dev 版）；main 上的提交不部署
name: Deploy to Cloudflare

on:
  release:
    types: [published]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'dev' || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Deploy (dev)
        working-directory: web
        run: npm run deploy:ci
        env:
          DEPLOY_ENV: dev
          DEPLOY_MESSAGE: dev ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify (dev)
        run: |
          want=$(echo "$GITHUB_SHA" | cut -c1-7)
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "https://hsbc-rewards-dev.pi-app.kdns.fr/version.json?t=$(date +%s)" | node -p 'JSON.parse(require("fs").readFileSync(0)).commit') || true
            echo "线上 $got，期望 $want"
            [ "$got" = "$want" ] && exit 0
            sleep 10
          done
          echo "::error::开发测试站版本与期望不一致"
          exit 1

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'web-v') ||
      startsWith(github.event.release.tag_name, 'script-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 需要全部标签

      - name: Resolve versions
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          latest() { git tag -l "$1*" --sort=-v:refname | head -n1; }
          case "$TAG" in
            web-v*)    web="$TAG";            script="$(latest script-v)" ;;
            script-v*) web="$(latest web-v)"; script="$TAG" ;;
            *)         web="$(latest web-v)"; script="$(latest script-v)" ;;
          esac
          web="${web:-$GITHUB_SHA}"; script="${script:-$GITHUB_SHA}"
          echo "网站取 $web，油猴脚本取 $script"

          # 标签版本号必须与文件里的一致（油猴只在 @version 变大时提示更新）
          webver=$(git show "$web:web/package.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          scriptver=$(git show "$script:hsbc_bill_export.user.js" | sed -n 's|^// @version *||p' | tr -d '[:space:]')
          case "$web" in web-v*) [ "${web#web-v}" = "$webver" ] || { echo "::error::$web 与 web/package.json 版本 $webver 不一致"; exit 1; } ;; esac
          case "$script" in script-v*) [ "${script#script-v}" = "$scriptver" ] || { echo "::error::$script 与脚本 @version $scriptver 不一致"; exit 1; } ;; esac

          git show "$script:hsbc_bill_export.user.js" > "$RUNNER_TEMP/dist.user.js"
          git checkout -q "$web"
          echo "web=$webver" >> "$GITHUB_OUTPUT"
          echo "script=$scriptver" >> "$GITHUB_OUTPUT"
          echo "### 部署：网站 $webver（$web）· 油猴脚本 $scriptver（$script）" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Deploy
        working-directory: web
        # versions upload + deploy：不改动自定义域名，Token 只需 Workers Editor
        run: npm run deploy:ci
        env:
          DEPLOY_MESSAGE: ${{ github.event.release.tag_name || 'manual' }} (web ${{ steps.v.outputs.web }} / script ${{ steps.v.outputs.script }})
          SCRIPT_SRC: ${{ runner.temp }}/dist.user.js
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify
        env:
          WANT: '{"web":"${{ steps.v.outputs.web }}","script":"${{ steps.v.outputs.script }}"}'
        run: |
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "https://hsbc-rewards.pi-app.kdns.fr/version.json?t=$(date +%s)" | node -p 'const v=JSON.parse(require("fs").readFileSync(0));JSON.stringify({web:v.web,script:v.script})') || true
            echo "线上 $got，期望 $WANT"
            [ "$got" = "$WANT" ] && exit 0
            sleep 10
          done
          echo "::error::线上版本与期望不一致"
          exit 1
